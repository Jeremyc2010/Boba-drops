<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form | Jeremy Cordero</title>
  <link rel="stylesheet" href="../Home Page/Home.css">
  <link rel="stylesheet" href="Form.css">
</head>
<body>
  <main class="page-content">
    <h1>Contact Me</h1>
    <p class="page-intro">Have a question about technology, STEM, or Celebration Hack Club? Use this form to write a message.</p>

    <section class="content-card">
      <p class="form-note">This is a sample form for this website. It does not send messages yet.</p>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="What would you like to talk about?" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <nav class="button-wrapper" aria-label="Main navigation">
    <a href="../Home Page/Home Page.html">Home</a>
    <a href="../About Page/About Page.html">About Me</a>
    <a href="../Lists/My Lists.html">Lists</a>
    <a href="../Table/My Table.html">Table</a>
    <a href="My form.html" aria-current="page">Forms</a>
    <a href="../Media/Media.html">Media</a>
    <a href="../Multimedia/My MultiMedia.html">Multimedia</a>
  </nav>
</body>
</html>
